<script>
/* ===================== 基本工具 ===================== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const fmt=(v,d=3)=>(!isFinite(v)?"—":(Math.abs(v)>=1e4||(Math.abs(v)<1e-3&&v!==0)?v.toExponential(2):v.toFixed(d)));
const C={ink:"#17242B",muted:"#5E6E72",blue:"#403990",amber:"#C75B2A",red:"#CF3D3E",green:"#3E6B4A"};
const FONT='12px -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif';
const FONTM='13px Georgia,"Songti TC",serif';
const RM=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ===================== 函數庫 ===================== */
const FN=[
 {key:"saddle",label:"f = x·y（像馬鞍）",f:(x,y)=>x*y,fx:(x,y)=>y,fy:(x,y)=>x,fxy:()=>1,rng:[-9,9]},
 {key:"bowl",label:"f = (x² + 2y²)/4（碗）",f:(x,y)=>(x*x+2*y*y)/4,fx:(x,y)=>x/2,fy:(x,y)=>y,fxy:()=>0,rng:[0,7]},
 {key:"hill",label:"f = 3·exp(−(x²+y²)/4)（山丘）",
  f:(x,y)=>3*Math.exp(-(x*x+y*y)/4),fx:(x,y)=>-1.5*x*Math.exp(-(x*x+y*y)/4),
  fy:(x,y)=>-1.5*y*Math.exp(-(x*x+y*y)/4),fxy:(x,y)=>0.75*x*y*Math.exp(-(x*x+y*y)/4),rng:[0,3]},
 {key:"wave",label:"f = sin x · cos y（波浪）",f:(x,y)=>Math.sin(x)*Math.cos(y),
  fx:(x,y)=>Math.cos(x)*Math.cos(y),fy:(x,y)=>-Math.sin(x)*Math.sin(y),
  fxy:(x,y)=>-Math.cos(x)*Math.sin(y),rng:[-1.15,1.15]},
 {key:"ridge",label:"f = x·exp(−(x²+y²)/6)（像彎彎的山稜）",
  f:(x,y)=>3*x*Math.exp(-(x*x+y*y)/6),
  fx:(x,y)=>3*Math.exp(-(x*x+y*y)/6)*(1-x*x/3),
  fy:(x,y)=>-x*y*Math.exp(-(x*x+y*y)/6),
  fxy:(x,y)=>-y*Math.exp(-(x*x+y*y)/6)*(1-x*x/3),rng:[-2.3,2.3]}
];
const DOM={a:-3,b:3};
/* 第 1 頁：經典單變數曲線 y = f(x)。曲面 = 把曲線沿 y 擠出（f 與 y 無關） */
const F1=[
 {key:"sq",   label:"f(x) = x²",            f:x=>x*x,            d:x=>2*x,          d2:x=>2,
  dom:[-3,3],      rng:[-0.6,9.6]},
 {key:"cub",  label:"f(x) = x³ − 3x",       f:x=>x*x*x-3*x,      d:x=>3*x*x-3,      d2:x=>6*x,
  dom:[-2.6,2.6],  rng:[-9.5,9.5]},
 {key:"sin",  label:"f(x) = sin x",         f:x=>Math.sin(x),    d:x=>Math.cos(x),  d2:x=>-Math.sin(x),
  dom:[-6.283,6.283], rng:[-1.25,1.25]},
 {key:"exp",  label:"f(x) = eˣ",            f:x=>Math.exp(x),    d:x=>Math.exp(x),  d2:x=>Math.exp(x),
  dom:[-3,2],      rng:[-0.5,7.8]},
 {key:"ln",   label:"f(x) = ln x",          f:x=>Math.log(x),    d:x=>1/x,          d2:x=>-1/(x*x),
  dom:[0.12,3],    rng:[-2.4,1.35]},
 {key:"rec",  label:"f(x) = 1/x",           f:x=>1/x,            d:x=>-1/(x*x),     d2:x=>2/(x*x*x),
  dom:[0.3,3],     rng:[-0.2,3.6]},
 {key:"sqrt", label:"f(x) = √x",            f:x=>Math.sqrt(x),   d:x=>0.5/Math.sqrt(x), d2:x=>-0.25/Math.pow(x,1.5),
  dom:[0.02,4],    rng:[-0.2,2.15]},
 {key:"gau",  label:"f(x) = e^(−x²)",       f:x=>Math.exp(-x*x), d:x=>-2*x*Math.exp(-x*x),
  d2:x=>(4*x*x-2)*Math.exp(-x*x), dom:[-2.6,2.6], rng:[-0.15,1.2]},
 {key:"logi", label:"f(x) = 1/(1 + e^(−x))", f:x=>1/(1+Math.exp(-x)),
  d:x=>{const e=Math.exp(-x);return e/Math.pow(1+e,2);},
  d2:x=>{const e=Math.exp(-x);return e*(e-1)/Math.pow(1+e,3);}, dom:[-6,6], rng:[-0.12,1.12]}
];

/* 第 7 頁：選一種計算方式 M du + N dv 的可積性與路徑相依 */
const RJ=8.314, CV=1.5*8.314;   // J/(mol·K)
const FIELDS=[
 {key:"xy",label:"M = 2xy，N = x²",ul:"x",vl:"y",zl:"Z",
  dom:[[-3,3],[-3,3]],decU:2,decV:2,A:[-2,-1.2],B:[2,1.2],
  M:(x,y)=>2*x*y,N:(x,y)=>x*x,Z:(x,y)=>x*x*y,
  note:"兩種順序都算出 2x。這個例子可以找到 Z = x²y + C，沿途加起來的結果只看起點和終點。"},
 {key:"quad",label:"M = 2x + y，N = x + 2y",ul:"x",vl:"y",zl:"Z",
  dom:[[-3,3],[-3,3]],decU:2,decV:2,A:[-2,-1.5],B:[2,0.6],
  M:(x,y)=>2*x+y,N:(x,y)=>x+2*y,Z:(x,y)=>x*x+x*y+y*y,
  note:"兩種順序都算出 1。這個例子可以找到 Z = x² + xy + y² + C，換路線不會改變結果。"},
 {key:"shear",label:"M = y，N = 0（結果跟路線有關）",ul:"x",vl:"y",zl:"∫ 累積值",
  dom:[[-3,3],[-3,3]],decU:2,decV:2,A:[-2,-1.2],B:[2,1.2],
  M:(x,y)=>y,N:()=>0,Z:null,
  note:"兩種順序算出 1 和 0，不一樣。這個例子沿不同路線走，累積的結果可能不同。"},
 {key:"rot",label:"M = −y，N = x（結果跟路線有關）",ul:"x",vl:"y",zl:"∫ 累積值",
  dom:[[-3,3],[-3,3]],decU:2,decV:2,A:[-2,-1.2],B:[2,1.2],
  M:(x,y)=>-y,N:(x,y)=>x,Z:null,
  note:"這個例子繞一圈，累積的值等於圈住面積的兩倍；換個繞行方向，正負號也會交換。"},
 {key:"vortex",label:"M = −y/r²，N = x/r²（原點有洞，不能踩）",ul:"x",vl:"y",zl:"θ",
  dom:[[-3,3],[-3,3]],decU:2,decV:2,A:[-2,-0.6],B:[2,-0.6],
  M:(x,y)=>-y/(x*x+y*y),N:(x,y)=>x/(x*x+y*y),Z:(x,y)=>Math.atan2(y,x),
  note:"這裡的原點像一個不能踩的洞。即使兩種順序在洞外算得一樣，繞洞一圈仍會多出 2π。畫面上角度跳回起點的接縫，不是真的山壁。"},
 {key:"dq",label:"δq = C_v dT + (RT/V) dV　理想氣體",ul:"V (L)",vl:"T (K)",zl:"∫δq (J/mol)",
  dom:[[0.5,5],[250,500]],decU:2,decV:0,A:[1,300],B:[4,450],
  M:(V,T)=>RJ*T/V,N:()=>CV,Z:null,
  note:"這裡算的是可逆過程的熱量。熱量會跟過程有關，所以用 δq，和狀態函數的 d 不同。"},
 {key:"ds",label:"dS = (C_v/T) dT + (R/V) dV　理想氣體",ul:"V (L)",vl:"T (K)",zl:"S (J/mol·K)",
  dom:[[0.5,5],[250,500]],decU:2,decV:0,A:[1,300],B:[4,450],
  M:(V,T)=>RJ/V,N:(V,T)=>CV/T,Z:(V,T)=>CV*Math.log(T)+RJ*Math.log(V),
  note:"把可逆過程中每一小段的熱量除以當時的溫度，再加起來，就得到熵的變化。這個例子可以找到熵 S，它是狀態函數。"}
];
function pathPts(F,A,B,bulge,n){
  const [ua,ub]=F.dom[0],[va,vb]=F.dom[1];
  const ax=(A[0]-ua)/(ub-ua),ay=(A[1]-va)/(vb-va);
  const bx=(B[0]-ua)/(ub-ua),by=(B[1]-va)/(vb-va);
  const dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy)||1,px=-dy/L,py=dx/L;
  const out=[];
  for(let i=0;i<=n;i++){
    const t=i/n,sB=Math.sin(Math.PI*t)*bulge;
    const X=clamp(ax+dx*t+px*sB,0,1),Y=clamp(ay+dy*t+py*sB,0,1);
    out.push([ua+X*(ub-ua),va+Y*(vb-va)]);
  }
  return out;
}
function runInt(F,pts){
  const acc=[0];
  for(let i=1;i<pts.length;i++){
    const du=pts[i][0]-pts[i-1][0],dv=pts[i][1]-pts[i-1][1];
    const mu=(pts[i][0]+pts[i-1][0])/2,mv=(pts[i][1]+pts[i-1][1])/2;
    acc.push(acc[i-1]+F.M(mu,mv)*du+F.N(mu,mv)*dv);
  }
  return acc;
}
function fieldPaths(){
  const st=S.s7,F=FIELDS[st.fn],n=700;
  const p1=pathPts(F,st.A,st.B,st.b1,n),p2=pathPts(F,st.A,st.B,st.b2,n);
  return {F,p1,p2,a1:runInt(F,p1),a2:runInt(F,p2),
          z0:F.Z?F.Z(st.A[0],st.A[1]):0};
}
const R=0.083145;                       // L·bar/(mol·K)
const IDEAL={V:(P,T)=>Number.isFinite(P)&&Number.isFinite(T)&&P>0&&T>0?R*T/P:NaN,P:(V,T)=>V>0&&T>0?R*T/V:NaN};
const VDW=(function(){
  const a=3.640,b=0.04267;              // CO2
  const Pf=(V,T)=>R*T/(V-b)-a/(V*V);
  const Tc=8*a/(27*R*b),Pc=a/(27*b*b);
  return {P:Pf,Tc,Pc,V:(P,T)=>{
    // This teaching surface deliberately supports only the smooth supercritical branch.
    if(!Number.isFinite(P)||!Number.isFinite(T)||P<=0||T<=Tc)return NaN;
    let lo=b*(1+1e-10),hi=Math.max(2*R*T/P,2*b);
    for(let i=0;i<100&&Pf(hi,T)>P;i++)hi*=2;
    if(!Number.isFinite(hi)||Pf(hi,T)>P)return NaN;
    for(let i=0;i<85;i++){const m=(lo+hi)/2;if(Pf(m,T)>P)lo=m;else hi=m;}
    const v=(lo+hi)/2;
    return v>b&&Math.abs(Pf(v,T)-P)<1e-8*Math.max(1,P)?v:NaN;
  }};
})();

// Bounded second-order differences; invalid model samples remain explicitly unavailable.
function derivative(f,x,h,lo,hi){
  if(!Number.isFinite(x)||x<lo||x>hi||!(hi>lo))return NaN;
  h=Math.min(h,(hi-lo)/4);
  let value;
  if(x-h>=lo&&x+h<=hi)value=(f(x+h)-f(x-h))/(2*h);
  else if(x+2*h<=hi)value=(-3*f(x)+4*f(x+h)-f(x+2*h))/(2*h);
  else value=(3*f(x)-4*f(x-h)+f(x-2*h))/(2*h);
  return Number.isFinite(value)?value:NaN;
}
function eosSlope(E,P,T){
  const v=E.V(P,T),a=E===VDW?3.640:0,b=E===VDW?0.04267:0;
  const pV=-R*T/(v-b)**2+2*a/v**3,pT=R/(v-b);
  return {v,dVdP:1/pV,dVdT:-pT/pV,dPdT:pT};
}

  ctx.setTransform(d,0,0,d,0,0);W=r.width;H=r.height;
}
cv.addEventListener("pointerdown",e=>{dragging={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);});
cv.addEventListener("pointermove",e=>{
  if(!dragging)return;
  cam.yaw+=(e.clientX-dragging.x)*0.008;
  cam.pitch=clamp(cam.pitch+(e.clientY-dragging.y)*0.006,-0.03,1.5566);
  dragging={x:e.clientX,y:e.clientY};schedule();
});
cv.addEventListener("pointerup",()=>{dragging=false;schedule();});
cv.addEventListener("pointercancel",()=>{dragging=false;schedule();});
cv.addEventListener("wheel",e=>{e.preventDefault();
  cam.zoom=clamp(cam.zoom*(e.deltaY>0?0.93:1.075),0.4,2.6);schedule();},{passive:false});
document.querySelectorAll(".views button").forEach(b=>b.onclick=()=>flyTo(CAMS[b.dataset.v]));
function flyTo(t){
  if(RM){cam={...t};render();return;}
  const s={...cam},t0=performance.now();
  (function tick(now){
    const k=clamp((now-t0)/550,0,1),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    cam.yaw=lerp(s.yaw,t.yaw,e);cam.pitch=lerp(s.pitch,t.pitch,e);cam.zoom=lerp(s.zoom,t.zoom,e);
    render();if(k<1)requestAnimationFrame(tick);
  })(t0);
}
function schedule(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;render();});}

/* 目前場景的座標映射 */
const AX=1,AY=1,AZ=0.70;
let SC=null;                            // {ua,ub,va,vb,za,zb,f,...}
const nx=u=>(((u-SC.ua)/(SC.ub-SC.ua))-0.5)*AX;
const ny=v=>(((v-SC.va)/(SC.vb-SC.va))-0.5)*AY;
// 高度保持等比例，不能把超出範圍的直線壓成折線。畫布自行裁掉畫面外的部分。
const nz=z=>((z-SC.za)/(SC.zb-SC.za)-0.5)*AZ;
const iu=x=>SC.ua+(x/AX+0.5)*(SC.ub-SC.ua);
const iv=y=>SC.va+(y/AY+0.5)*(SC.vb-SC.va);
let VIEW=null;
function makeView(){
  const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  const s=Math.min(W,H)*cam.zoom;
  return {
    p(x,y,z){const a=x*cy-y*sy,b=x*sy+y*cy;
      return {x:W/2+a*s,y:H/2-(b*sp+z*cp)*s+H*0.04,d:b*cp-z*sp};},
    t:{x:-sy*cp,y:-cy*cp,z:sp}          // 指向觀察者的單位向量
  };
}
const P3=(u,v,z)=>VIEW.p(nx(u),ny(v),nz(z));

/* 曲面網格快取 */
const cache={key:null,N:0,Z:null,NZ:null};
function buildGrid(N){
  if(cache.key===SC.key&&cache.N===N)return cache;
  const Z=[],NZ=[];
  for(let i=0;i<=N;i++){
    Z[i]=[];NZ[i]=[];
    const u=lerp(SC.ua,SC.ub,i/N);
    for(let j=0;j<=N;j++){
      const v=lerp(SC.va,SC.vb,j/N);
      const z=SC.f(u,v);Z[i][j]=z;NZ[i][j]=nz(z);
    }
  }
  cache.key=SC.key;cache.N=N;cache.Z=Z;cache.NZ=NZ;
  return cache;
}
/* 由網格做雙線性內插（正規化高度），供遮蔽判斷使用 */
function nzAt(x,y,g){
  const N=g.N;
  const fi=clamp((x/AX+0.5)*N,0,N-1e-6),fj=clamp((y/AY+0.5)*N,0,N-1e-6);
  const i=Math.floor(fi),j=Math.floor(fj),ti=fi-i,tj=fj-j;
  const a=g.NZ[i][j],b=g.NZ[i+1][j],c=g.NZ[i][j+1],d=g.NZ[i+1][j+1];
  return lerp(lerp(a,b,ti),lerp(c,d,ti),tj);
}
function visible(u,v,z,g){
  let x=nx(u),y=ny(v),zz=nz(z);
  const t=VIEW.t,h=0.022;
  for(let s=h;s<2.2;s+=h){
    const X=x+t.x*s,Y=y+t.y*s,Zr=zz+t.z*s;
    if(Math.abs(X)>AX/2||Math.abs(Y)>AY/2)return true;
    if(Zr>AZ*0.62)return true;
    if(nzAt(X,Y,g)>Zr+0.006)return false;
  }
  return true;
}

/* ===================== 著色 ===================== */
const RAMP=[[0,[212,225,244]],[0.5,[234,235,239]],[1,[250,240,211]]];
function ramp(t){
  t=clamp(t,0,1);
  for(let k=0;k<RAMP.length-1;k++){
    const a=RAMP[k],b=RAMP[k+1];
    if(t<=b[0]){const s=(t-a[0])/(b[0]-a[0]||1);
      return [lerp(a[1][0],b[1][0],s),lerp(a[1][1],b[1][1],s),lerp(a[1][2],b[1][2],s)];}
  }
  return RAMP[RAMP.length-1][1];
}
function shade(col,dif,spec){
  // 淡色曲面只用輕微明暗表示起伏，避免背光面變黑。
  const light=0.90+0.10*dif;
  return 'rgb('+col.map(v=>Math.round(v*light)).join(',')+')';
}

/* ===================== 主繪製 ===================== */
let QUICK=false,QT=null,lastPaint=0;
function render(){
  const now=(window.performance&&performance.now)?performance.now():Date.now();
  QUICK=(now-lastPaint)<170;
  paint();
  lastPaint=(window.performance&&performance.now)?performance.now():Date.now();
  clearTimeout(QT);
  if(QUICK)QT=setTimeout(()=>{QUICK=false;paint();
    lastPaint=(window.performance&&performance.now)?performance.now():Date.now();},200);
}
function paint(){
  fit();VIEW=makeView();
  const st=STEPS[S.step];
  SC=st.scene();
  const N=QUICK?46:(window.innerWidth<900?72:108);
  const g=SC.flat?null:buildGrid(N);
  ctx.clearRect(0,0,W,H);
  const items=st.items?st.items():{};
  drawBase(g,items);
  if(g)drawSurface(g);
  drawItems(items,g);
  drawAxes();
  if(S.step===2)drawDirectionGuide();
  st.read&&st.read();
  document.getElementById("hint").textContent=
    S.step===5?"紫藍線：溫度不變　橘線：壓力不變":"拖曳轉動圖形・滾輪放大縮小";
}

function drawBase(g,items){
  // 底面框線
  ctx.save();ctx.strokeStyle="#AEB2B8";ctx.lineWidth=1;ctx.setLineDash([1,6]);ctx.lineCap="round";ctx.beginPath();
  for(let i=0;i<=8;i++){
    const A=P3(lerp(SC.ua,SC.ub,i/8),SC.va,SC.za),B=P3(lerp(SC.ua,SC.ub,i/8),SC.vb,SC.za);
    const D=P3(SC.ua,lerp(SC.va,SC.vb,i/8),SC.za),E=P3(SC.ub,lerp(SC.va,SC.vb,i/8),SC.za);
    ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.moveTo(D.x,D.y);ctx.lineTo(E.x,E.y);
  }
  ctx.stroke();ctx.restore();
  if(!items.contours)return;
  // 底面等高線（由網格 marching squares）
  const M=56,Zs=[];
  for(let i=0;i<=M;i++){Zs[i]=[];for(let j=0;j<=M;j++){
    Zs[i][j]=SC.f(lerp(SC.ua,SC.ub,i/M),lerp(SC.va,SC.vb,j/M));}}
  const lv=[];for(let k=1;k<14;k++)lv.push(lerp(SC.za,SC.zb,k/14));
  ctx.save();ctx.strokeStyle="#BABDC2";ctx.lineWidth=0.8;ctx.setLineDash([1,6]);ctx.lineCap="round";ctx.beginPath();
  for(let i=0;i<M;i++)for(let j=0;j<M;j++){
    const u0=lerp(SC.ua,SC.ub,i/M),u1=lerp(SC.ua,SC.ub,(i+1)/M);
    const v0=lerp(SC.va,SC.vb,j/M),v1=lerp(SC.va,SC.vb,(j+1)/M);
    const q=[Zs[i][j],Zs[i+1][j],Zs[i+1][j+1],Zs[i][j+1]];
    const pu=[u0,u1,u1,u0],pv=[v0,v0,v1,v1];
    lv.forEach(L=>{
      const pts=[];
      for(let e=0;e<4;e++){const a=q[e],b=q[(e+1)%4];
        if((a-L)*(b-L)<0){const t=(L-a)/(b-a);
          pts.push([lerp(pu[e],pu[(e+1)%4],t),lerp(pv[e],pv[(e+1)%4],t)]);}}
      for(let k=0;k+1<pts.length;k+=2){
        const A=P3(pts[k][0],pts[k][1],SC.za),B=P3(pts[k+1][0],pts[k+1][1],SC.za);
        ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);}
    });
  }
  ctx.stroke();ctx.restore();
}

function drawSurface(g){
  const N=g.N,NZ=g.NZ,Z=g.Z;
  const hx=AX/N,hy=AY/N;
  const L={x:-0.38,y:-0.66,z:0.65},ll=Math.hypot(L.x,L.y,L.z);
  L.x/=ll;L.y/=ll;L.z/=ll;
  const t=VIEW.t,Hv={x:L.x+t.x,y:L.y+t.y,z:L.z+t.z};
  const hl=Math.hypot(Hv.x,Hv.y,Hv.z);Hv.x/=hl;Hv.y/=hl;Hv.z/=hl;
  const quads=[];
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    const x0=(i/N-0.5)*AX,x1=((i+1)/N-0.5)*AX,y0=(j/N-0.5)*AY,y1=((j+1)/N-0.5)*AY;
    const z00=NZ[i][j],z10=NZ[i+1][j],z11=NZ[i+1][j+1],z01=NZ[i][j+1];
    const ps=[VIEW.p(x0,y0,z00),VIEW.p(x1,y0,z10),VIEW.p(x1,y1,z11),VIEW.p(x0,y1,z01)];
    const dzx=((z10-z00)+(z11-z01))/(2*hx),dzy=((z01-z00)+(z11-z10))/(2*hy);
    const nl=Math.hypot(dzx,dzy,1);
    const n={x:-dzx/nl,y:-dzy/nl,z:1/nl};
    const dif=Math.max(0,n.x*L.x+n.y*L.y+n.z*L.z);
    const sp=Math.pow(Math.max(0,n.x*Hv.x+n.y*Hv.y+n.z*Hv.z),26)*0.30;
    const zm=(Z[i][j]+Z[i+1][j]+Z[i+1][j+1]+Z[i][j+1])/4;
    const col=ramp((zm-SC.za)/(SC.zb-SC.za));
    quads.push({ps,d:(ps[0].d+ps[1].d+ps[2].d+ps[3].d)/4,c:shade(col,dif,sp)});
  }
  quads.sort((a,b)=>b.d-a.d);
  for(const q of quads){
    const p=q.ps;
    const cx=(p[0].x+p[1].x+p[2].x+p[3].x)/4,cy=(p[0].y+p[1].y+p[2].y+p[3].y)/4;
    ctx.fillStyle=q.c;ctx.beginPath();
    for(let k=0;k<4;k++){                       // 向外撐 0.7px，消除接縫
      const dx=p[k].x-cx,dy=p[k].y-cy,l=Math.hypot(dx,dy)||1;
      const X=p[k].x+dx/l*0.7,Y=p[k].y+dy/l*0.7;
      k?ctx.lineTo(X,Y):ctx.moveTo(X,Y);
    }
    ctx.closePath();ctx.fill();
  }
}

/* items: {curtains,curves,baseCurves,vectors,plane,points,labels,contours} */
function drawItems(it,g){
  (it.curtains||[]).forEach(cu=>{
    ctx.save();ctx.fillStyle=cu.fill;ctx.beginPath();
    cu.pts.forEach((p,k)=>{const q=P3(p[0],p[1],p[2]);k?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);});
    for(let k=cu.pts.length-1;k>=0;k--){const p=cu.pts[k],q=P3(p[0],p[1],SC.za);ctx.lineTo(q.x,q.y);}
    ctx.closePath();ctx.fill();ctx.restore();
  });
  (it.baseCurves||[]).forEach(c=>strokePts(c.pts.map(p=>[p[0],p[1],SC.za]),c.color,c.width||2,c.dash));
  (it.curves||[]).forEach(c=>{
    if(c.noOcclusion||!g){strokePts(c.pts,c.color,c.width||3,c.dash);return;}
    let run=[],vis=null;
    c.pts.forEach(p=>{
      const v=visible(p[0],p[1],p[2],g);
      if(vis===null)vis=v;
      if(v!==vis){run.push(p);flushRun(run,vis,c);run=[p];vis=v;}
      else run.push(p);
    });
    flushRun(run,vis,c);
  });
  if(it.plane){
    const pl=it.plane,su=(SC.ub-SC.ua)*pl.size,sv=(SC.vb-SC.va)*pl.size;
    const cor=[[-su,-sv],[su,-sv],[su,sv],[-su,sv]].map(d=>
      P3(pl.u0+d[0],pl.v0+d[1],pl.val+pl.fu*d[0]+pl.fv*d[1]));
    ctx.save();ctx.fillStyle="rgba(168,58,43,0.12)";ctx.strokeStyle="rgba(168,58,43,0.40)";ctx.lineWidth=1;ctx.setLineDash([5,5]);
    ctx.beginPath();cor.forEach((q,k)=>k?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
    ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
  }
  (it.vectors||[]).forEach(v=>{
    const A=P3(v.a[0],v.a[1],v.a[2]),B=P3(v.b[0],v.b[1],v.b[2]);
    arrow(A,B,v.color,v.width||2.4);
  });
  (it.points||[]).forEach(p=>{
    const q=P3(p.u,p.v,p.z);
    ctx.save();ctx.fillStyle=p.color;ctx.strokeStyle="#fff";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(q.x,q.y,p.r||6,0,7);ctx.fill();ctx.stroke();ctx.restore();
  });
  const labelBoxes=[];
  (it.labels||[]).forEach(l=>{
    const q=P3(l.u,l.v,l.z);
    ctx.save();ctx.font=l.font||FONTM;ctx.textAlign="center";ctx.textBaseline="middle";
    const w=ctx.measureText(l.text).width;
    const anchor={x:q.x,y:q.y};
    q.x=clamp(q.x+(l.dx||0),w/2+12,W-w/2-12);q.y=clamp(q.y+(l.dy||0),22,H-65);
    for(let k=0;k<12&&labelBoxes.some(b=>Math.abs(q.x-b.x)<(w+b.w)/2+10&&Math.abs(q.y-b.y)<26);k++)q.y=clamp(q.y+28,22,H-65);
    labelBoxes.push({x:q.x,y:q.y,w});
    if(!l.noLeader&&(l.dx||l.dy)){ctx.strokeStyle=l.color||C.ink;ctx.lineWidth=1;ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(anchor.x,anchor.y);ctx.lineTo(q.x,q.y);ctx.stroke();ctx.setLineDash([]);}
    ctx.fillStyle="rgba(255,255,255,0.82)";
    ctx.fillRect(q.x-w/2-3,q.y-9,w+6,18);
    ctx.fillStyle=l.color||C.ink;ctx.fillText(l.text,q.x,q.y);ctx.restore();
  });
}
function flushRun(run,vis,c){
  if(run.length<2)return;
  if(vis)strokePts(run,c.color,c.width||3,c.dash);
  else strokePts(run,c.color,(c.width||3)*0.6,[4,5],0.28);
}
function strokePts(pts,color,width,dash,alpha){
  ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineJoin="round";
  if(alpha!==undefined)ctx.globalAlpha=alpha;
  if(dash)ctx.setLineDash(dash);
  ctx.beginPath();
  pts.forEach((p,k)=>{const q=P3(p[0],p[1],p[2]);k?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);});
  if(width>=3){ctx.save();ctx.strokeStyle="rgba(255,255,255,0.92)";ctx.lineWidth=width+2.6;ctx.stroke();ctx.restore();}
  ctx.stroke();ctx.restore();
}
function arrow(A,B,color,width){
  const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy);if(L<2)return;
  const ux=dx/L,uy=dy/L,hl=Math.min(13,L*0.35);
  ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=width;
  ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x-ux*hl*0.8,B.y-uy*hl*0.8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(B.x,B.y);
  ctx.lineTo(B.x-ux*hl-uy*hl*0.4,B.y-uy*hl+ux*hl*0.4);
  ctx.lineTo(B.x-ux*hl+uy*hl*0.4,B.y-uy*hl-ux*hl*0.4);
  ctx.closePath();ctx.fill();ctx.restore();
}
function drawAxes(){
  const O=P3(SC.ua,SC.va,SC.za);
  const ends=[P3(SC.ub,SC.va,SC.za),P3(SC.ua,SC.vb,SC.za),P3(SC.ua,SC.va,SC.zb)];
  const names=S.step===5?['壓力 P（bar）','溫度 T（K）','體積 V（L）']:[SC.ul,SC.vl,SC.zl];
  ctx.save();ctx.setLineDash([]);
  ends.forEach((p,i)=>{
    // 白邊把黑色主軸和曲面分開。
    arrow(O,p,'#FFFFFF',6);arrow(O,p,'#111111',3);
    const dx=p.x-O.x,dy=p.y-O.y,len=Math.hypot(dx,dy)||1;
    ctx.font='bold 15px "Microsoft JhengHei",sans-serif';
    const width=ctx.measureText(names[i]).width;
    const x=clamp(p.x+dx/len*24,width/2+10,W-width/2-10);
    const y=clamp(p.y+dy/len*24,18,H-56);
    ctx.fillStyle='rgba(255,255,255,0.96)';ctx.fillRect(x-width/2-5,y-12,width+10,24);
    ctx.fillStyle='#111111';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(names[i],x,y);
  });
  ctx.restore();
}

/* 曲面上的一條線（沿方向 u），回傳取樣點 */
function lineOnSurface(x0,y0,ux,uy,smin,smax,n){
  const out=[];
  for(let i=0;i<=n;i++){
    const s=lerp(smin,smax,i/n),x=x0+s*ux,y=y0+s*uy;
    if(x<SC.ua||x>SC.ub||y<SC.va||y>SC.vb)continue;
    out.push([x,y,SC.f(x,y)]);
  }
  return out;
}
/* 切線（在曲面上方的直線），以參數延伸 */
function tangentLine(x0,y0,ux,uy,slope,f0,smin,smax){
  const out=[];
  for(let i=0;i<=40;i++){
    const s=lerp(smin,smax,i/40),x=x0+s*ux,y=y0+s*uy;
    if(x<SC.ua||x>SC.ub||y<SC.va||y>SC.vb)continue;
    out.push([x,y,f0+slope*s]);
  }
  return out;
}

/* ===================== 介面樣板 ===================== */
function fillSel(id,labels,val,cb){
  const el=document.getElementById(id);if(!el)return;
  el.innerHTML=labels.map((l,i)=>'<option value="'+i+'">'+l+'</option>').join("");
  el.value=val;el.onchange=()=>cb(+el.value);
}
function isNum(el){return !!el&&el.tagName==="INPUT";}
function trimVal(v,d){
  if(v!==0&&Math.abs(v)<Math.pow(10,-d))return String(+(+v).toPrecision(3));
  return (+v).toFixed(d);
}
function rng(id,vid,val,cb,dec,unit){
  const el=document.getElementById(id);if(!el)return;
  const nu=document.getElementById(vid),d=(dec===undefined?2:dec);
  if(isNum(nu)){nu.step=String(Math.pow(10,-d));nu.min=el.min;nu.max=el.max;}
  el.value=val;setRange(id,vid,val,dec,unit);
  el.oninput=()=>{const v=+el.value;setRange(id,vid,v,dec,unit);cb(v);};
  if(isNum(nu)){
    const apply=(commit)=>{
      let v=parseFloat(nu.value);
      if(!isFinite(v)){if(!commit)return;v=+el.value;}
      v=clamp(v,parseFloat(el.min),parseFloat(el.max));
      el.value=v;if(commit)nu.value=trimVal(v,d);cb(v);
    };
    nu.oninput=()=>apply(false);
    nu.onchange=()=>apply(true);
    nu.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();apply(true);nu.blur();}};
  }
}
function setRange(id,vid,v,dec,unit){
  const el=document.getElementById(id);if(el)el.value=v;
  const t=document.getElementById(vid);if(!t)return;
  const d=(dec===undefined?2:dec);
  if(isNum(t)){if(document.activeElement!==t)t.value=trimVal(v,d);}
  else t.textContent=(+v).toFixed(d)+(unit||"");
}
function setBounds(id,vid,min,max,step){
  const el=document.getElementById(id);if(!el)return;
  el.min=min;el.max=max;if(step!==undefined)el.step=step;
  const nu=document.getElementById(vid);
  if(isNum(nu)){nu.min=min;nu.max=max;}
}
function chk(id,val,cb){const el=document.getElementById(id);if(!el)return;
  el.checked=val;el.onchange=()=>cb(el.checked);}
function tbl(id,rows){
  const el=document.getElementById(id);if(!el)return;
  el.innerHTML=rows.map(r=>'<tr><td class="k">'+r[0]+'</td><td class="val '+(r[2]||"")+'">'+r[1]+'</td></tr>').join("");
}
function surfScene(o,keyExtra){
  return {key:o.key+(keyExtra||""),ua:DOM.a,ub:DOM.b,va:DOM.a,vb:DOM.b,
          za:o.rng[0],zb:o.rng[1],f:o.f,ul:"x",vl:"y",zl:"f"};
}

/* ===================== 六個步驟 ===================== */
const STEPS=[
{
 nav:"微分",
 lead:'<b>紅線像一把靠在曲線旁的直尺。</b>它穿過紅點，方向跟曲線在那裡一樣，叫做「切線」。橘色虛線連著紅點和橘點，叫做「割線」。把 Δx 調小，讓兩點靠近，看看橘線會不會越來越接近紅線。',
 scene(){
   const o=F1[S.s1.fn];
   return {key:"c1_"+o.key,ua:o.dom[0],ub:o.dom[1],va:-1.5,vb:1.5,
           za:o.rng[0],zb:o.rng[1],f:(x,y)=>o.f(x),ul:"x",vl:"y（高度不隨它改變）",zl:"f"};
 },
 panel:`
  <h2>選曲線，移動看看</h2>
  <div class="ctl"><label>選一條曲線</label><select id="a-fn"></select></div>
  <div class="ctl"><label>切點 <span class="math"><i>x</i><sub>0</sub></span>
      <input class="num" type="number" id="a-x0v"></label>
    <input type="range" id="a-x0"></div>
  <div class="ctl"><label>步長 <span class="math">Δ<i>x</i></span>
      <input class="num" type="number" id="a-dxv"></label>
    <input type="range" id="a-dx"></div>
  <div class="quick" id="a-quick"></div>
  <div class="ctl"><label>薄片位置 <span class="math"><i>y</i><sub>0</sub></span>
      <input class="num" type="number" id="a-y0v"></label>
    <input type="range" id="a-y0" min="-1.4" max="1.4" step="0.02"></div>
  <div class="checks">
    <label><input type="checkbox" id="a-sec" checked> 割線（連起兩點的直線）</label>
    <label><input type="checkbox" id="a-tan" checked> 切線（紅點當下的坡度）</label>
  </div>
  <button class="act" id="a-anim">讓兩點慢慢靠近</button>
  <div class="note" id="a-gap-explanation" aria-live="polite"></div>
  <hr class="rule"><h2>現在的數字</h2><table class="read" id="a-read"></table>
  <div class="eq">d<i>f</i> = <i>f</i>′(<i>x</i><sub>0</sub>) d<i>x</i>　　
    Δ<i>f</i> − d<i>f</i> ≈ ½ <i>f</i>″(<i>x</i><sub>0</sub>) Δ<i>x</i>²</div>
  <div class="note">可以直接輸入 0.1、0.01 或 0.001，按輸入鍵或點別處就會更新。步子越小，切線通常估得越準。最後一列把誤差除以 Δx²，讓你看看這個數字會不會慢慢接近固定的值。</div>`,
 bounds(){
   const o=F1[S.s1.fn],m=(o.dom[1]-o.dom[0])*0.015;
   setBounds("a-x0","a-x0v",(o.dom[0]+m).toFixed(3),(o.dom[1]-m).toFixed(3),0.001);
   const span=(o.dom[1]-o.dom[0])*0.45;
   setBounds("a-dx","a-dxv",(-span).toFixed(3),span.toFixed(3),0.001);
   S.s1.x0=clamp(S.s1.x0,o.dom[0]+m,o.dom[1]-m);
   S.s1.dx=clamp(S.s1.dx,-span,span);
   setRange("a-x0","a-x0v",S.s1.x0,3);
   setRange("a-dx","a-dxv",S.s1.dx,3);
 },
 init(){
   fillSel("a-fn",F1.map(o=>o.label),S.s1.fn,v=>{S.s1.fn=v;STEPS[0].bounds();render();});
   rng("a-x0","a-x0v",S.s1.x0,v=>{S.s1.x0=v;render();},3);
   rng("a-dx","a-dxv",S.s1.dx,v=>{S.s1.dx=v;render();},3);
   rng("a-y0","a-y0v",S.s1.y0,v=>{S.s1.y0=v;render();},2);
   STEPS[0].bounds();
   const q=document.getElementById("a-quick");
   if(q){
     q.innerHTML=[1,0.5,0.1,0.01,0.001].map(v=>'<button data-d="'+v+'">Δx = '+v+'</button>').join("");
     q.querySelectorAll("button").forEach(b=>b.onclick=()=>{
       const sg=S.s1.dx<0?-1:1;
       S.s1.dx=sg*Math.min(+b.dataset.d,Math.abs(+document.getElementById("a-dx").max));
       setRange("a-dx","a-dxv",S.s1.dx,3);render();});
   }
   chk("a-sec",S.s1.sec,v=>{S.s1.sec=v;render();});
   chk("a-tan",S.s1.tan,v=>{S.s1.tan=v;render();});
   const b=document.getElementById("a-anim");
   if(b)b.onclick=()=>{
     const mx=Math.abs(+document.getElementById("a-dx").max);
     const start=Math.abs(S.s1.dx)<0.2*mx?mx*0.85:Math.abs(S.s1.dx);
     const sg=S.s1.dx<0?-1:1,t0=performance.now();
     (function tick(t){
       const k=Math.min(1,(t-t0)/2400);
       S.s1.dx=sg*Math.max(0.002,start*Math.pow(1-k,2.6));
       setRange("a-dx","a-dxv",S.s1.dx,3);render();
       if(k<1)requestAnimationFrame(tick);})(t0);
   };
 },
 items(){
   const o=F1[S.s1.fn],st=S.s1;
   const curve=lineOnSurface(st.x0,st.y0,1,0,SC.ua-st.x0,SC.ub-st.x0,220);
   const f0=o.f(st.x0),m=o.d(st.x0);
   const x1=clamp(st.x0+st.dx,SC.ua,SC.ub),dxe=x1-st.x0,f1=o.f(x1);
   const it={contours:false,
     curtains:[{pts:curve,fill:"rgba(31,92,122,0.13)"}],
     curves:[{pts:curve,color:C.blue,width:3.2}],
     points:[{u:st.x0,v:st.y0,z:f0,color:C.red}],labels:[]};
   if(st.tan)it.curves.push({pts:tangentLine(st.x0,st.y0,1,0,m,f0,SC.ua-st.x0,SC.ub-st.x0),
     color:C.red,width:2.4,noOcclusion:true});
   if(st.sec&&Math.abs(dxe)>1e-6){
     const sec=(f1-f0)/dxe;
     it.curves.push({pts:tangentLine(st.x0,st.y0,1,0,sec,f0,SC.ua-st.x0,SC.ub-st.x0),
       color:C.amber,width:2,dash:[7,5],noOcclusion:true});
     it.points.push({u:x1,v:st.y0,z:f1,color:C.amber,r:5});
     if(st.tan){
       const estimate=f0+m*dxe,error=f1-estimate;
       it.points.push({u:x1,v:st.y0,z:estimate,color:C.red,r:5});
       it.curves.push({pts:[[x1,st.y0,estimate],[x1,st.y0,f1]],color:C.green,width:3,dash:[3,4],noOcclusion:true});
       const higher=f1>=estimate;
       it.labels.push(
         {u:x1,v:st.y0,z:f1,text:'實際位置（曲線上）',color:C.amber,font:FONT,dx:95,dy:higher?-30:38},
         {u:x1,v:st.y0,z:estimate,text:'估計位置（切線上）',color:C.red,font:FONT,dx:-95,dy:higher?38:-30});
       if(Math.abs(error)>(SC.zb-SC.za)*0.025)it.labels.push({u:x1,v:st.y0,z:(f1+estimate)/2,text:'實際與估計的差距',color:C.green,font:FONT,dx:115,dy:0});
     }
     it.curves.push({pts:[[st.x0,st.y0,f0],[x1,st.y0,f0]],color:"#9AA6A0",width:1.6,dash:[5,4],noOcclusion:true});
     if(Math.abs(dxe)>0.08)
       it.labels.push({u:(st.x0+x1)/2,v:st.y0,z:f0,text:"Δx",color:C.muted,font:FONT});
   }
   return it;
 },
 read(){
   const o=F1[S.s1.fn],st=S.s1;
   const f0=o.f(st.x0),m=o.d(st.x0);
   const x1=clamp(st.x0+st.dx,SC.ua,SC.ub),dxe=x1-st.x0,f1=o.f(x1);
   const df=m*dxe,Df=f1-f0,err=Df-df;
   const gapNote=document.getElementById("a-gap-explanation");
   if(gapNote)gapNote.textContent="先看同一個 x 位置：橘點在曲線上，是實際位置；紅點在切線上，是估計位置。綠色虛線連起兩點，只表示估計差多少，不是另一條路，也不是切線。把 Δx 調小，再看看差距。";
   tbl("a-read",[["f(x₀)",fmt(f0,4),""],
     ["割線斜率 Δf/Δx",fmt(Math.abs(dxe)>1e-9?Df/dxe:NaN),"am"],
     ["切線斜率 f′(x₀)",fmt(m),"hi"],
     ["df = f′(x₀)Δx",fmt(df,5),"hi"],
     ["Δf（實際變化）",fmt(Df,5),"am"],
     ["實際 − 估計（有正負）",fmt(err,6),"gr"],
     ["½f″(x₀)Δx²",fmt(0.5*o.d2(st.x0)*dxe*dxe,6),"gr"],
     ["誤差 ÷ Δx²",fmt(Math.abs(dxe)>1e-9?err/(dxe*dxe):NaN,4),""]]);
 }
},
{
 nav:"偏微分",
 lead:'<b>想像你站在一座小山上。</b>往左右走，和往前後走，坡度可能不同。藍色那片固定 y，只改 x；橘色那片固定 x，只改 y。這樣一次只看一個方向的變化，叫做「偏微分」。公式右下角的小字，就是提醒你哪個量要保持不變。',
 scene(){return surfScene(FN[S.s2.fn]);},
 panel:`
  <h2>動手調整</h2>
  <div class="ctl"><label>曲面</label><select id="b-fn"></select></div>
  <div class="ctl"><label><span class="math"><i>x</i><sub>0</sub></span><input class="num" type="number" id="b-x0v"></label>
    <input type="range" id="b-x0" min="-2.8" max="2.8" step="0.02"></div>
  <div class="ctl"><label><span class="math"><i>y</i><sub>0</sub></span><input class="num" type="number" id="b-y0v"></label>
    <input type="range" id="b-y0" min="-2.8" max="2.8" step="0.02"></div>
  <hr class="rule"><h2>現在的數字</h2><table class="read" id="b-read"></table>
  <div class="eq"><span class="bl">(∂<i>f</i>/∂<i>x</i>)<sub><i>y</i></sub></span>：藍薄片上的斜率<br>
    <span class="am">(∂<i>f</i>/∂<i>y</i>)<sub><i>x</i></sub></span>：橘薄片上的斜率</div>
  <div class="note">按「看 x 方向」或「看 y 方向」，比較兩條曲線。偏微分公式裡的小字，會告訴你哪個量保持不變。</div>`,
 init(){
   fillSel("b-fn",FN.map(o=>o.label),S.s2.fn,v=>{S.s2.fn=v;render();});
   rng("b-x0","b-x0v",S.s2.x0,v=>{S.s2.x0=v;render();},2);
   rng("b-y0","b-y0v",S.s2.y0,v=>{S.s2.y0=v;render();},2);
 },
 items(){
   const o=FN[S.s2.fn],st=S.s2,f0=o.f(st.x0,st.y0);
   const cx=lineOnSurface(st.x0,st.y0,1,0,SC.ua-st.x0,SC.ub-st.x0,150);
   const cy=lineOnSurface(st.x0,st.y0,0,1,SC.va-st.y0,SC.vb-st.y0,150);
   return {
     contours:true,
     curtains:[{pts:cx,fill:"rgba(31,92,122,0.12)"},{pts:cy,fill:"rgba(169,102,12,0.12)"}],
     curves:[{pts:cx,color:C.blue,width:3.2},{pts:cy,color:C.amber,width:3.2},
       {pts:tangentLine(st.x0,st.y0,1,0,o.fx(st.x0,st.y0),f0,-1.4,1.4),color:C.red,width:2.4,noOcclusion:true},
       {pts:tangentLine(st.x0,st.y0,0,1,o.fy(st.x0,st.y0),f0,-1.4,1.4),color:C.red,width:2.4,noOcclusion:true}],
     points:[{u:st.x0,v:st.y0,z:f0,color:C.red}]
   };
 },
 read(){
   const o=FN[S.s2.fn],st=S.s2;
   tbl("b-read",[["f(x₀,y₀)",fmt(o.f(st.x0,st.y0)),""],
     ["(∂f/∂x)_y",fmt(o.fx(st.x0,st.y0)),"bl"],
     ["(∂f/∂y)_x",fmt(o.fy(st.x0,st.y0)),"am"],
     ["∂²f/∂x∂y = ∂²f/∂y∂x",fmt(o.fxy(st.x0,st.y0)),"gr"]]);
 }
},
{
 nav:"方向導數",
 lead:'<b>換個方向走，坡度會怎麼變？</b>轉動 θ，就能選你要走的方向。「方向導數」就是這個方向的坡度。綠色箭頭叫做「梯度」，它指向上坡最快的方向；如果這裡是平的，就沒有唯一的最快方向。',
 scene(){return surfScene(FN[S.s3.fn]);},
 panel:`
  <h2>動手調整</h2>
  <div class="ctl"><label>曲面</label><select id="c-fn"></select></div>
  <div class="ctl"><label>你要往哪裡走（°）<input class="num" type="number" id="c-thv"></label>
    <input type="range" id="c-th" min="0" max="360" step="1"></div>
  <div class="ctl"><label><span class="math"><i>x</i><sub>0</sub></span><input class="num" type="number" id="c-x0v"></label>
    <input type="range" id="c-x0" min="-2.6" max="2.6" step="0.02"></div>
  <div class="ctl"><label><span class="math"><i>y</i><sub>0</sub></span><input class="num" type="number" id="c-y0v"></label>
    <input type="range" id="c-y0" min="-2.6" max="2.6" step="0.02"></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
    <button class="act" id="c-g">朝上坡最快的方向</button>
    <button class="act" id="c-c">朝當下不升高的方向</button>
    <button class="act" id="c-s">轉一圈</button>
  </div>
  <div class="checks"><label><input type="checkbox" id="c-circle" checked> 顯示各方向坡度的圓形圖</label></div>
  <hr class="rule"><h2>現在的數字</h2><table class="read" id="c-read"></table>
  <div class="eq"><i>D</i><sub><b>u</b></sub><i>f</i> = <i>f<sub>x</sub></i>cos θ + <i>f<sub>y</sub></i>sin θ = |∇<i>f</i>| cos φ</div>
  <div class="note">朝著等高線的方向，當下的坡度是 0。等高線就是把一樣高的地方連起來的線，像地圖上的山坡線。</div>`,
 init(){
   fillSel("c-fn",FN.map(o=>o.label),S.s3.fn,v=>{S.s3.fn=v;render();});
   rng("c-th","c-thv",S.s3.th,v=>{S.s3.th=v;render();},0,"°");
   rng("c-x0","c-x0v",S.s3.x0,v=>{S.s3.x0=v;render();},2);
   rng("c-y0","c-y0v",S.s3.y0,v=>{S.s3.y0=v;render();},2);
   chk("c-circle",S.s3.circle,v=>{S.s3.circle=v;render();});
   const o=()=>FN[S.s3.fn];
   const set=a=>{S.s3.th=(a+360)%360;setRange("c-th","c-thv",S.s3.th,0,"°");render();};
   const g=document.getElementById("c-g"),c=document.getElementById("c-c"),s=document.getElementById("c-s");
   if(g)g.onclick=()=>set(Math.atan2(o().fy(S.s3.x0,S.s3.y0),o().fx(S.s3.x0,S.s3.y0))*180/Math.PI);
   if(c)c.onclick=()=>set(Math.atan2(o().fy(S.s3.x0,S.s3.y0),o().fx(S.s3.x0,S.s3.y0))*180/Math.PI+90);
   if(s)s.onclick=()=>{const a0=S.s3.th,t0=performance.now();
     (function tick(t){const k=Math.min(1,(t-t0)/4200);set(a0+k*360);
       if(k<1)requestAnimationFrame(tick);})(t0);};
 },
 items(){
   const o=FN[S.s3.fn],st=S.s3,th=st.th*Math.PI/180;
   const ux=Math.cos(th),uy=Math.sin(th);
   const f0=o.f(st.x0,st.y0),fx=o.fx(st.x0,st.y0),fy=o.fy(st.x0,st.y0);
   const Du=fx*ux+fy*uy,gm=Math.hypot(fx,fy);
   const cu=lineOnSurface(st.x0,st.y0,ux,uy,-5,5,220);
   const it={
     contours:true,
     curtains:[{pts:cu,fill:"rgba(168,58,43,0.12)"}],
     curves:[{pts:cu,color:C.red,width:3.2},
             {pts:tangentLine(st.x0,st.y0,ux,uy,Du,f0,-1.5,1.5),color:C.ink,width:2.2,noOcclusion:true}],
     baseCurves:[],
     vectors:[{a:[st.x0,st.y0,SC.za],b:[clamp(st.x0+ux*1.15,SC.ua,SC.ub),clamp(st.y0+uy*1.15,SC.va,SC.vb),SC.za],color:C.red}],
     points:[{u:st.x0,v:st.y0,z:f0,color:C.red}]
   };
   if(gm>1e-6){
     const s=Math.min(1.5,1.5/gm);
     it.vectors.push({a:[st.x0,st.y0,SC.za],
       b:[clamp(st.x0+fx*s,SC.ua,SC.ub),clamp(st.y0+fy*s,SC.va,SC.vb),SC.za],color:C.green});
   }
   if(st.circle&&gm>1e-6){
     const sc=Math.min(1.4/gm,1.4/Math.max(gm,0.2)),pts=[];
     for(let i=0;i<=180;i++){
       const a=i/180*2*Math.PI,d=(fx*Math.cos(a)+fy*Math.sin(a))*sc;
       pts.push([clamp(st.x0+d*Math.cos(a),SC.ua,SC.ub),clamp(st.y0+d*Math.sin(a),SC.va,SC.vb)]);
     }
     it.baseCurves.push({pts,color:C.green,width:1.8,dash:[5,4]});
     it.baseCurves.push({pts:[[st.x0,st.y0],[clamp(st.x0+Du*sc*ux,SC.ua,SC.ub),clamp(st.y0+Du*sc*uy,SC.va,SC.vb)]],
       color:C.red,width:2.6});
   }
   return it;
 },
 read(){
   const o=FN[S.s3.fn],st=S.s3,th=st.th*Math.PI/180;
   const fx=o.fx(st.x0,st.y0),fy=o.fy(st.x0,st.y0);
   const Du=fx*Math.cos(th)+fy*Math.sin(th),gm=Math.hypot(fx,fy);
   tbl("c-read",[["∂f/∂x（θ=0°）",fmt(fx),"bl"],["∂f/∂y（θ=90°）",fmt(fy),"am"],
     ["|∇f|",fmt(gm),"gr"],["∇f 方向",fmt((Math.atan2(fy,fx)*180/Math.PI+360)%360,1)+"°","gr"],
     ["沿紅箭頭的坡度",fmt(Du),"hi"]]);
 }
},
{
 nav:"全微分",
 lead:'<b>把一張平板放在曲面上的紅點。</b>平板跟曲面在這一點的坡度相同，叫做「切平面」。藍色和橘色線段是在平板上算出的高度變化，加起來就是 df。真正的曲面可能高一點或低一點，綠線就是兩者的差。試著把移動的距離縮小。',
 scene(){return surfScene(FN[S.s4.fn]);},
 panel:`
  <h2>動手調整</h2>
  <div class="ctl"><label>曲面</label><select id="d-fn"></select></div>
  <div class="ctl"><label><span class="math">d<i>x</i></span><input class="num" type="number" id="d-dxv"></label>

  <div class="ctl"><label><span class="math">d<i>y</i></span><input class="num" type="number" id="d-dyv"></label>
    <input type="range" id="d-dy" min="-1.6" max="1.6" step="0.01"></div>
  <div class="ctl"><label><span class="math"><i>x</i><sub>0</sub></span><input class="num" type="number" id="d-x0v"></label>

 panel:`
  <h2>怎麼分：狀態函數與路徑函數？</h2>
  <div class="note"><b>想像從山腳走到山頂。</b><br>高度差只看起點和終點，像「狀態函數的變化」。走了多遠要看你走哪條路，像「路徑函數」。熱力學裡，熱量和功也常叫「過程量」。</div>
  <ol style="padding-left:22px;font-size:13px;line-height:1.8">
    <li><b>先固定同一個起點和終點。</b>熱力學要固定完整的狀態，不能只說溫度一樣。</li>
    <li><b>換一條路，再算一次。</b>只要找到兩條合法路線的結果確實不同，就能說它跟路線有關。用電腦算時，要先排除計算誤差。</li>
    <li><b>兩條路相同，先別急著下結論。</b>要證明是狀態函數的變化，必須對所有合法路線都成立；可以用下面的公式方法。</li>
  </ol>
  <details class="note"><summary style="cursor:pointer;color:var(--blue)">用公式怎麼判斷？點開看</summary>
    <p>假設每一小步算的是 ω = M du + N dv。</p>
    <p><b>方法一：找出 Z。</b>如果能找到整個範圍都適用、每個位置只有一個值的 Z，而且 ∂Z/∂u = M、∂Z/∂v = N，就有 ω = dZ。沿途加起來一定是 Z(B) − Z(A)。Z 就是狀態函數。</p>
    <p><b>方法二：比較兩個偏導。</b>算 ∂M/∂v 和 ∂N/∂u。若它們在某處不同，就不是全微分。若處處相同，還要確認範圍沒有洞（單連通開區域），而且 M、N 的一階偏導連續，才能保證找到全域的 Z。</p>
    <p><b>方法三：繞一圈回到起點。</b>狀態函數回到原狀，總變化一定是 0，所以 ∮dZ = 0。找到一圈不是 0，就知道跟路線有關；只有一圈等於 0，還不夠。每一條合法封閉路線都等於 0，才是完整的判斷。</p>
  </details>
  <div class="note"><b>熱力學例子</b><br>內能 U、焓 H、熵 S、吉布斯自由能 G 是狀態函數。熱量 Q 和功 W 跟過程有關，通常寫成 δQ、δW。熵的變化可以用可逆路徑的 ∫δQ<sub>rev</sub>/T 計算；不能隨便把不可逆過程的熱量除以溫度就當成熵變。</div>

 read(){
   const st=S.s7,P=fieldPaths(),F=P.F;
   const hu=(F.dom[0][1]-F.dom[0][0])*2e-4,hv=(F.dom[1][1]-F.dom[1][0])*2e-4;
   const mu=(st.A[0]+st.B[0])/2,mv=(st.A[1]+st.B[1])/2;
   const dMdv=derivative(v=>F.M(mu,v),mv,hv,...F.dom[1]);
   const dNdu=derivative(u=>F.N(u,mv),mu,hu,...F.dom[0]);
   let worst=0,rel=0;
   const samp=[];
   for(let i=1;i<10;i++)for(let j=1;j<10;j++){
     const u=lerp(F.dom[0][0],F.dom[0][1],i/10),v=lerp(F.dom[1][0],F.dom[1][1],j/10);
     const m=F.M(u,v),nn=F.N(u,v);
     if(!isFinite(m)||!isFinite(nn))continue;
     samp.push({u,v,mag:Math.hypot(m,nn)});
   }
   const mags=samp.map(o=>o.mag).sort((x,y)=>x-y);
   const med=mags.length?mags[Math.floor(mags.length/2)]:1;   // 以中位數界定「正常」量級
   samp.forEach(o=>{
     if(o.mag>100*med+1e-9)return;                            // 丟掉奇點附近的取樣
     const a=(F.M(o.u,o.v+hv)-F.M(o.u,o.v-hv))/(2*hv),
           b=(F.N(o.u+hu,o.v)-F.N(o.u-hu,o.v))/(2*hu);
     if(!isFinite(a)||!isFinite(b))return;
     worst=Math.max(worst,Math.abs(a-b));
     rel=Math.max(rel,Math.abs(a-b)/(1+Math.max(Math.abs(a),Math.abs(b))));
   });
   const ok=rel<1e-5;
   const I1=P.a1[P.a1.length-1],I2=P.a2[P.a2.length-1];
   const loopBig=Math.abs(I1-I2)>1e-3*(1+Math.max(Math.abs(I1),Math.abs(I2)));
   tbl("g-read",[["∂M/∂v（AB 中點）",fmt(dMdv,4),"bl"],["∂N/∂u（AB 中點）",fmt(dNdu,4),"am"],
     ["差值",fmt(dMdv-dNdu,4),"hi"],
     ["抽查位置的最大差距",fmt(worst,4),""],
     ["比較結果",ok?(loopBig?"附近相同，繞一圈卻有差":"抽查相同，還不能當作證明"):"有差，會跟路線有關",ok&&!loopBig?"gr":"hi"]]);
   tbl("g-read2",[["I₁（藍路徑）",fmt(I1,4),"bl"],["I₂（橘路徑）",fmt(I2,4),"am"],
     ["∮ = I₁ − I₂",fmt(I1-I2,4),"gr"],
     ["Z(B) − Z(A)",F.Z?fmt(F.Z(st.B[0],st.B[1])-F.Z(st.A[0],st.A[1]),4):"沒有可用的單一 Z",F.Z?"":"hi"]]);
   const explanation=document.getElementById('g-explain');
   if(explanation){
     const proven=['xy','quad','ds'].includes(F.key);
     const kind=proven?'這個例子有全域的 Z，所以是狀態函數的變化。':F.key==='vortex'?'這個範圍的原點有洞，找不到全域單值的 Z。畫出的角度曲面有接縫，不能拿它當全域的證明。':'這個例子不是全微分，結果可能跟路線有關。';
     explanation.textContent=kind+' 目前兩條路的差是 '+fmt(I1-I2,5)+'。'+(loopBig?(proven?'這次數值和已知公式不一致，需留意積分誤差。':'這次選的兩條路算出不同結果；讀數仍含數值誤差。'):'這次兩條路的數字很接近；單靠這一次比較，還不能判斷所有路。');
   }
   const nt=document.getElementById("g-note");
   if(nt)nt.textContent=F.note;
 }
}];

function tangentGeometry(i){

}

}

 const description=i===0?'紅色直線是切線，箭頭是沿著它的切向量。這頁沒有另外畫切平面。':i===1?'兩個箭頭從同一個曲面上的點出發，分別沿著兩條切線。這頁沒有另外畫切平面。':i===2?'曲面上的箭頭是切向量；地面上的箭頭只表示往哪裡走，兩者不同。這頁沒有另外畫切平面。':'曲面上的箭頭是切向量。淡紅色平板是切平面，四周虛線只是它的邊框。藍橘階梯是把高度變化拆開來看，不是切線。';
 step.panel='<div class="note"><b>先認清圖形</b><br>'+description+'</div>'+step.panel;
 if(i>=3)step.panel+='<details class="note"><summary>為什麼這張平板是切平面？</summary><p>'+formula+'</p><p>把起點代進去，平板和曲面會碰在同一點。兩個方向的坡度也都用曲面在起點的偏導數，所以任何方向的當下坡度都相同。</p><p>切平面不必整張貼在曲面上，也可能穿過曲面。重點是接觸點的位置和坡度相同。箭頭為了看清楚有縮放長度，方向沒有改變。</p></details>';
});


function drawDirectionGuide(){
 const st=S.s3,o=FN[st.fn],th=st.th*Math.PI/180;
 const fx=o.fx(st.x0,st.y0),fy=o.fy(st.x0,st.y0),gm=Math.hypot(fx,fy),ga=Math.atan2(fy,fx);
 const delta=Math.atan2(Math.sin(ga-th),Math.cos(ga-th)),phi=Math.abs(delta)*180/Math.PI;
 const size=Math.min(230,W-20,H-85),left=W-size-10,top=10;
 const cx=left+size/2,cy=top+size/2+5,r=size*0.30;
 ctx.save();ctx.fillStyle='rgba(255,255,255,0.97)';ctx.fillRect(left,top,size,size);
 ctx.strokeStyle='#BCC1C7';ctx.lineWidth=1;ctx.strokeRect(left,top,size,size);
 ctx.font='12px "Microsoft JhengHei",sans-serif';ctx.fillStyle='#17242B';ctx.textAlign='center';
 ctx.fillText('這是方向圖，不是山坡側面',cx,top+19);
 const point=(a,l)=>({x:cx+Math.cos(a)*l,y:cy-Math.sin(a)*l});
 arrow({x:cx,y:cy},point(0,r+12),'#777777',1);
 ctx.fillStyle='#555555';ctx.fillText('x',cx+r+16,cy+15);
 arrow({x:cx,y:cy},point(th,r),C.red,3);
 if(gm>1e-9){
  arrow({x:cx,y:cy},point(ga,r),C.green,3);
  ctx.strokeStyle='#403990';ctx.lineWidth=2.5;ctx.beginPath();
  for(let k=0;k<=48;k++){const p=point(th+delta*k/48,r*0.52);k?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);}
  ctx.stroke();const p=point(th+delta/2,r*0.72);ctx.fillStyle='#403990';ctx.fillText('φ',p.x,p.y);
 }
 ctx.fillStyle='#17242B';ctx.fillStyle=C.red;ctx.fillText('紅：你往這裡走',cx,top+36);
 ctx.fillStyle=C.green;ctx.fillText('綠：上坡最快',cx,top+52);
 ctx.fillStyle='#17242B';ctx.fillText(gm>1e-9?'兩個方向差 '+fmt(phi,1)+'°':'這一點各方向的坡度都是 0',cx,top+size-34);
 const slope=fx*Math.cos(th)+fy*Math.sin(th);
 const result=gm<1e-9||Math.abs(slope)<1e-8?'當下不升也不降':slope>0?(slope/gm>0.98?'上坡最快':slope/gm<0.15?'稍微上坡':'正在上坡'):(slope/gm< -0.98?'下坡最快':slope/gm> -0.15?'稍微下坡':'正在下坡');
 ctx.fillText('沿紅箭頭走 → '+result,cx,top+size-14);
 ctx.restore();
}
STEPS[2].panel='<div class="note"><b>沿紅色方向走，算出來就是方向導數。</b><br>紅色箭頭 u：你選的方向。綠色箭頭 ∇f：上坡最快的方向。兩者之間是 φ。滑桿 θ 則是從 x 軸量到紅箭頭，這是另一個角。</div>'+STEPS[2].panel;
const directionRead=STEPS[2].read;
STEPS[2].read=function(){directionRead.call(this);
 const o=FN[S.s3.fn],st=S.s3,fx=o.fx(st.x0,st.y0),fy=o.fy(st.x0,st.y0),gm=Math.hypot(fx,fy),th=st.th*Math.PI/180;
 const phi=gm>1e-9?Math.acos(clamp((fx*Math.cos(th)+fy*Math.sin(th))/gm,-1,1))*180/Math.PI:NaN;
 const table=document.getElementById('c-read');if(table)table.innerHTML+='<tr><td>φ（紅、綠箭頭夾角）</td><td>'+ (Number.isFinite(phi)?fmt(phi,1)+'°':'梯度為 0，角度沒有定義')+'</td></tr>';
};
// 地面箭頭只縮放長度，不分別夾住座標，以免改變方向。
const directionItems=STEPS[2].items;
STEPS[2].items=function(){const it=directionItems.call(this),st=S.s3,o=FN[st.fn],th=st.th*Math.PI/180;
 const fx=o.fx(st.x0,st.y0),fy=o.fy(st.x0,st.y0),gm=Math.hypot(fx,fy);
 it.vectors=it.vectors.filter(v=>v.width===3.6);
 const add=(x,y,color)=>{let l=1.1;for(const [p,d,lo,hi] of [[st.x0,x,SC.ua,SC.ub],[st.y0,y,SC.va,SC.vb]])if(d!==0)l=Math.min(l,0.95*(d>0?hi-p:lo-p)/d);it.vectors.push({a:[st.x0,st.y0,SC.za],b:[st.x0+x*l,st.y0+y*l,SC.za],color,width:3});};
 add(Math.cos(th),Math.sin(th),C.red);if(gm>1e-9)add(fx/gm,fy/gm,C.green);
 return it;
};

// 每頁只留下理解這個概念需要的操作；公式與模型維持原本的計算。
S.s1.fn=0;S.s1.x0=1;S.s1.y0=0;S.s1.dx=0.3;
S.s2.fn=0;S.s2.x0=1;S.s2.y0=1;
S.s3.fn=0;S.s3.x0=1.2;S.s3.y0=0.6;S.s3.circle=false;
S.s4.fn=1;S.s4.dx=0.3;S.s4.dy=0.3;
S.s5.fn=1;S.s5.cx=false;S.s5.cy=false;S.s5.grad=false;S.s5.cont=false;
S.s6.model=0;S.s6.T=430;S.s6.P=12;S.s6.dT=10;S.s6.dP=0.5;
S.s7.arrows=false;S.s7.b2=0;
const minimalControls=[['a-fn','a-x0','a-dx'],['b-fn','b-x0','b-y0'],['c-fn','c-x0','c-y0','c-th'],['d-fn','d-x0','d-y0','d-dx','d-dy'],['e-fn','e-x0','e-y0','e-th'],['f-dT','f-dP'],['g-b1']];
const minimalHelp=[
 '先選函數、輸入觀察點 x₀，再調 Δx。把橘點慢慢移近紅點，看割線如何接近切線。Δx = 0 時兩點重合，割線斜率不能用兩點相除；微分看的是靠近 0 的極限。',
 '先選函數，輸入觀察點 (x₀, y₀)。一次只改一個座標，另一個先不動；這就是偏微分要保持另一個量不變的意思。',
 '紅箭頭是你要走的方向，綠箭頭是上坡最快的方向。轉動紅箭頭，看看現在是上坡還是下坡。紫色角度是在比較兩個方向，不是山坡傾斜的角度。',
 '選好函數與觀察點，再改兩個方向的移動距離。兩個距離越小，切平面的估計通常越接近曲面。',
 '只轉方向，觀察切向量一直留在同一張切平面上。',
 '先固定 1 莫耳理想氣體，起點是 430 K、12 bar。只改 ΔT 和 ΔP，看看體積改變多少。',
 '起點、終點和橘色路線固定，只改藍色路線。先看狀態函數，再換成路徑函數比較。'
];
const minimalTables=['a-read','b-read','c-read','d-read','e-read','f-read','g-read2'];
STEPS.forEach((step,i)=>{
 let original=step.panel,visible='';
 const ids=minimalControls[i];
 original=original.replace(/<div class="ctl">[\s\S]*?<\/div>/g,block=>{if(ids.some(id=>block.includes('id="'+id+'"'))){visible+=block;return '';}return block;});
 const tableId=minimalTables[i],table=new RegExp('<table[^>]*id="'+tableId+'"[^>]*><\/table>');
 original=original.replace(table,'');
 if(i===6)for(const id of ['g-state-demo','g-path-demo']){const re=new RegExp('<button id="'+id+'"[^>]*>[\s\S]*?<\/button>');original=original.replace(re,b=>{visible+=b;return '';});}
 if(i===5){original=original.replace(/<button id="f-half"[^>]*>[\s\S]*?<\/button>/,b=>{visible+=b;return '';});}
 step.panel='<h2>選函數與觀察位置</h2><p class="note">'+minimalHelp[i]+'</p>'+visible+'<h2>看這幾個數字</h2><table class="read minimal-read" id="'+tableId+'"></table><div hidden aria-hidden="true">'+original+'</div>';
 step.lead=minimalHelp[i];
});
/* ===================== 主流程 ===================== */
const navEl=document.getElementById("nav"),leadEl=document.getElementById("lead"),panelEl=document.getElementById("panel");
navEl.innerHTML=STEPS.map((s,i)=>'<button data-i="'+i+'"><span class="n">'+(i+1)+'</span>'+s.nav+'</button>').join("");
navEl.querySelectorAll("button").forEach(b=>b.onclick=()=>go(+b.dataset.i));
function go(i){
  S.step=i;
  cam=i===5?{yaw:-0.85,pitch:0.58,zoom:0.82}:{...CAMS.iso};
  navEl.querySelectorAll("button").forEach((b,k)=>b.setAttribute("aria-current",k===i?"true":"false"));
  leadEl.innerHTML=STEPS[i].lead;
  const prompts=["把橘點移近紅點，看看兩條直線。","保持 y 不動，再試試保持 x 不動。","轉個方向，猜猜哪邊最陡。","把兩個移動距離縮小，看看綠線。","先關掉幾個圖形，再一個一個打開。","先猜體積會變大還是變小，再看數字。","把路線彎一點，看看終點高度。"];
  panelEl.innerHTML='<div class="note"><b>試試看：</b>'+prompts[i]+'</div><div class="quick"><button id="reset-view">回到原本的角度</button></div>'+STEPS[i].panel;
  document.getElementById('reset-view').onclick=()=>flyTo(i===5?{yaw:-0.85,pitch:0.58,zoom:0.82}:CAMS.iso);
  STEPS[i].init&&STEPS[i].init();
  cache.key=null;
  render();
}
window.addEventListener("resize",()=>{clearTimeout(window._rt);window._rt=setTimeout(render,80);});
window.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
  if(e.key==="ArrowRight")go(Math.min(STEPS.length-1,S.step+1));
  if(e.key==="ArrowLeft")go(Math.max(0,S.step-1));
});
go(0);
</script>
