<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com http://127.0.0.1:*; frame-src https://accounts.google.com https://core-lab-member-portal.firebaseapp.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>CORE Lab Desktop 同步登入</title>
  <style>
    body{margin:0;background:#f4f5f8;color:#20233a;font-family:"Noto Sans TC",system-ui,sans-serif}
    main{max-width:560px;margin:10vh auto;padding:36px;background:#fff;border:1px solid #e3e6ef;border-radius:18px;box-shadow:0 18px 50px rgba(31,35,55,.09)}
    .eyebrow{color:#5b5ce2;font-size:12px;font-weight:700;letter-spacing:.12em}h1{margin:8px 0 10px;font-size:28px}p{line-height:1.7;color:#686e82}
    button{margin-top:16px;border:0;border-radius:9px;background:#171a2b;color:#fff;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.ok{color:#16835e}.error{color:#c43e50}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">CORE LAB DESKTOP</div>
    <h1>連結桌面 App</h1>
    <p>使用已核准的 Google 帳號登入。驗證完成後，只會將短效 Firebase 登入憑證傳回你電腦上的本機程式。</p>
    <button id="sign-in" type="button">使用 Google 帳號登入並同步</button>
    <p id="status" role="status" aria-live="polite">等待登入。</p>
  </main>
  <script src="assets/firebase-config.js"></script>
  <script type="module" src="assets/desktop-sync.js"></script>
</body>
</html>
